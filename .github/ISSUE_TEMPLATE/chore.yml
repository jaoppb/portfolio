name: "Chore"
description: "Tooling, CI, housekeeping, or dependencies"
title: "chore: "
labels: ["type:chore"]
body:
  - type: markdown
    attributes:
      value: "After filing, set the area label, milestone (v0, v1, etc.), priority (P0-P3), effort (1-13 Fibonacci), and parent epic if applicable. See AGENTS.md."
  - type: textarea
    id: goal
    attributes:
      label: "Goal"
      description: "What gets set up, upgraded, or kept in order."
    validations:
      required: true
  - type: textarea
    id: details-scope
    attributes:
      label: "Details & Scope"
      description: "Why now and what is done."
  - type: textarea
    id: depends
    attributes:
      label: "Depends on"
      description: "Issues that must close first, as #numbers with a reason."
      value: |
        None.
  - type: textarea
    id: dod
    attributes:
      label: "Definition of Done"
      description: "Observable, checkable outcomes."
      value: |
        - [ ] Task completed and verified
        - [ ] `just issues-check` passes
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: "Non-goals"
      description: "What this issue explicitly does not do."

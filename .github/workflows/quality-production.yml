name: Quality Production

# The launch audit on the live site (docs/workflows/launch.md). Started by hand, never by a
# pull request or a push: it depends on the network and on what is deployed, so it is not
# part of the required CI check. It reads public URLs only and uses no secrets.
on:
  workflow_dispatch:
    inputs:
      state:
        description: Indexing state the live site must be in
        required: true
        type: choice
        options:
          - noindex
          - indexable

concurrency:
  group: quality-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Live checks, Lighthouse & axe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QUALITY_TARGET: production
      QUALITY_EXPECT: ${{ inputs.state }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Check the live hosts
        run: pnpm quality:live

      - name: Run axe on both locales
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm quality:axe:audit

      - name: Run Lighthouse CI
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm quality:lighthouse:audit

      - name: Publish Lighthouse summary
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm quality:lighthouse:summary

      - name: Upload Lighthouse and axe reports
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quality-production-reports
          path: quality/reports
          if-no-files-found: warn
          retention-days: 14

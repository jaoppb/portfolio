name: Deploy Preview

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    environment:
      name: preview
    permissions:
      contents: read
      issues: write
      pull-requests: write
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build site
        uses: ./.github/actions/build-site

      - name: Deploy Preview to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH_NAME: ${{ github.head_ref }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          NO_COLOR: "1"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials not available. Skipping preview deployment."
            exit 0
          fi

          DEPLOY_OUTPUT=$(pnpm exec wrangler pages deploy apps/web/out \
            --project-name=jaoppb-portfolio \
            --branch="$BRANCH_NAME" \
            --commit-hash="$COMMIT_SHA" \
            --commit-dirty=true)
          echo "$DEPLOY_OUTPUT"

          PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[^ ]*\.pages\.dev' | head -n 1)
          if [ -z "$PREVIEW_URL" ]; then
            echo "Failed to extract preview deployment URL from Wrangler output."
            exit 1
          fi
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"

      - name: Update Pull Request Preview Comment
        if: steps.deploy.outputs.preview_url != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH_NAME: ${{ github.head_ref }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            const commitSha = process.env.COMMIT_SHA;
            const branchName = process.env.BRANCH_NAME;
            const shortSha = commitSha ? commitSha.substring(0, 7) : '';
            const marker = '<!-- cloudflare-pages-preview-deployment -->';
            const prNumber = context.payload.pull_request?.number || context.issue.number;

            const commentBody = [
              marker,
              '### ⚡ Cloudflare Pages Preview Deployment',
              '',
              '| Name | Status | Preview URL |',
              '| :--- | :--- | :--- |',
              `| **Preview** | Ready | [${previewUrl}](${previewUrl}) |`,
              '',
              `- **Branch**: \`${branchName}\``,
              `- **Commit**: \`${shortSha}\``,
              '',
              `*Deployment generated automatically by GitHub Actions.*`
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existingComment = comments.find((comment) =>
              comment.body?.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
            }

      - name: Publish Job Summary
        if: steps.deploy.outputs.preview_url != ''
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          BRANCH_NAME: ${{ github.head_ref }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "### ⚡ Cloudflare Pages Preview Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Preview URL**: [$PREVIEW_URL]($PREVIEW_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch**: \`$BRANCH_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: \`$COMMIT_SHA\`" >> "$GITHUB_STEP_SUMMARY"

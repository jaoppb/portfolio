name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome check
        run: pnpm exec biome check .

      - name: Check architectural boundaries
        run: pnpm exec fallow architecture

      - name: Check for dead code
        run: pnpm exec fallow dead-code

      - name: Check Terraform formatting and configuration
        run: |
          terraform fmt -check -recursive terraform/
          terraform -chdir=terraform/bootstrap init -backend=false -input=false
          terraform -chdir=terraform/bootstrap validate
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run Vitest unit & accessibility tests
        run: pnpm test

      - name: Run quality gate script tests
        run: pnpm test:quality

  build:
    name: Static Export Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Restore Next.js cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com

      - name: Verify static export output
        run: |
          if [ ! -f apps/web/out/index.html ]; then
            echo "Build failed to generate apps/web/out/index.html"
            exit 1
          fi

  quality:
    name: Lighthouse & axe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Indexable build on purpose: no NEXT_PUBLIC_ROBOTS_NOINDEX, so the SEO audits
      # check what production serves after launch (docs/workflows/quality-gate.md).
      - name: Build site
        id: build
        uses: ./.github/actions/build-site
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com

      - name: Run axe on both locales
        run: pnpm quality:axe

      - name: Run Lighthouse CI
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm quality:lighthouse

      - name: Publish Lighthouse summary
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm quality:lighthouse:summary

      - name: Upload Lighthouse and axe reports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quality-reports
          path: quality/reports
          if-no-files-found: warn
          retention-days: 14

  ci:
    name: CI
    needs: [lint, test, build, quality]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate CI status
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Quality: ${{ needs.quality.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.quality.result }}" != "success" ]; then
            echo "CI pipeline failed. Please check the individual job results above."
            exit 1
          fi
          echo "All CI pipeline checks passed successfully."

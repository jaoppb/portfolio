name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  deploy-production:
    name: Deploy Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://jaoppb.com
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DEPLOY_OUTPUT=$(npx --yes wrangler@4 pages deploy apps/web/out \
            --project-name=jaoppb-portfolio \
            --branch=main \
            --commit-hash="${{ github.sha }}" \
            --commit-message="${{ github.event.head_commit.message }}" \
            --commit-dirty=true)
          echo "$DEPLOY_OUTPUT"

          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[^ ]*\.pages\.dev' | head -n 1)
          echo "deployment_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"

      - name: Publish Job Summary
        run: |
          echo "### 🚀 Cloudflare Pages Production Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Production URL**: [https://jaoppb.com](https://jaoppb.com)" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.deploy.outputs.deployment_url }}" ]; then
            echo "- **Pages Deployment URL**: [${{ steps.deploy.outputs.deployment_url }}](${{ steps.deploy.outputs.deployment_url }})" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- **Commit**: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-preview:
    name: Deploy Preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: preview
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: check_credentials
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "has_credentials=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare credentials are not configured or inaccessible in this context. Skipping preview deployment."
          else
            echo "has_credentials=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.check_credentials.outputs.has_credentials == 'true'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        if: steps.check_credentials.outputs.has_credentials == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Restore Next.js cache
        if: steps.check_credentials.outputs.has_credentials == 'true'
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        if: steps.check_credentials.outputs.has_credentials == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build static export
        if: steps.check_credentials.outputs.has_credentials == 'true'
        run: pnpm build

      - name: Deploy Preview to Cloudflare Pages
        if: steps.check_credentials.outputs.has_credentials == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          COMMIT_SHA="${{ github.event.pull_request.head.sha }}"

          DEPLOY_OUTPUT=$(npx --yes wrangler@4 pages deploy apps/web/out \
            --project-name=jaoppb-portfolio \
            --branch="${BRANCH_NAME}" \
            --commit-hash="${COMMIT_SHA}" \
            --commit-dirty=true)
          echo "$DEPLOY_OUTPUT"

          PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[^ ]*\.pages\.dev' | head -n 1)
          if [ -z "$PREVIEW_URL" ]; then
            echo "Failed to extract preview deployment URL from Wrangler output."
            exit 1
          fi
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"

      - name: Update Pull Request Preview Comment
        if: steps.check_credentials.outputs.has_credentials == 'true' && steps.deploy.outputs.preview_url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH_NAME: ${{ github.head_ref }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            const commitSha = process.env.COMMIT_SHA;
            const branchName = process.env.BRANCH_NAME;
            const shortSha = commitSha ? commitSha.substring(0, 7) : '';
            const marker = '<!-- cloudflare-pages-preview-deployment -->';
            const prNumber = context.payload.pull_request?.number || context.issue.number;

            const commentBody = [
              marker,
              '### ⚡ Cloudflare Pages Preview Deployment',
              '',
              '| Name | Status | Preview URL |',
              '| :--- | :--- | :--- |',
              `| **Preview** | Ready | [${previewUrl}](${previewUrl}) |`,
              '',
              `- **Branch**: \`${branchName}\``,
              `- **Commit**: \`${shortSha}\``,
              '',
              `*Deployment generated automatically by GitHub Actions.*`
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existingComment = comments.find((comment) =>
              comment.body?.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
            }

      - name: Publish Job Summary
        if: steps.check_credentials.outputs.has_credentials == 'true' && steps.deploy.outputs.preview_url != ''
        run: |
          echo "### ⚡ Cloudflare Pages Preview Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Preview URL**: [${{ steps.deploy.outputs.preview_url }}](${{ steps.deploy.outputs.preview_url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch**: \`${{ github.head_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: \`${{ github.event.pull_request.head.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
